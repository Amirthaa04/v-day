<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Ponmozhi ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffe0ec, #fff0f5);
    font-family: Georgia, serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Button Screen */
#startScreen {
    text-align: center;
}

#startBtn {
    padding: 15px 30px;
    font-size: 20px;
    border-radius: 30px;
    border: none;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
}

/* Letter */
.letter {
    display: none;
    max-width: 700px;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    opacity: 0;
    transform: translateY(50px);
}

/* Show animation */
.show {
    display: block;
    animation: floatIn 2s forwards;
}

@keyframes floatIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h1 {
    text-align: center;
    color: #ff4d6d;
}

.signature {
    margin-top: 20px;
    text-align: right;
}

/* Hearts */
.heart {
    position: absolute;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
    from { transform: translateY(100vh); opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<!-- START BUTTON -->
<div id="startScreen">
    <h2>Click to read something special 💖</h2>
    <button id="startBtn">Open Letter 💌</button>
</div>

<!-- LETTER -->
<div class="letter" id="letterBox">
    <h1>To My Love, Ponmozhi ❤️</h1>
    <p id="text"></p>
    <div class="signature">Forever yours ❤️</div>
</div>

<!-- MUSIC -->
<audio id="music" src="https://www.bensound.com/bensound-music/bensound-romantic.mp3"></audio>

<script>
const btn = document.getElementById("startBtn");
const letter = document.getElementById("letterBox");
const textEl = document.getElementById("text");
const music = document.getElementById("music");

const message = `
From the moment you came into my life,
everything started to feel… right.

Your smile, your voice, the way you exist —
it all became my favorite part of every day.

I don’t know what I did to deserve you,
but I promise… I’ll never take you for granted.

Through every laugh, every fight,
every ordinary day — I choose you.

Always.

I love you, Ponmozhi ❤️
`;

btn.addEventListener("click", () => {
    document.getElementById("startScreen").style.display = "none";
    letter.classList.add("show");

    music.play();
    typeWriter();
    startHearts();
});

// TYPEWRITER EFFECT
let i = 0;
function typeWriter() {
    if (i < message.length) {
        textEl.innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
    }
}

// FLOATING HEARTS
function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.innerHTML = "❤️";
        heart.classList.add("heart");

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 10) + "px";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }, 300);
}
</script>

</body>
</html>
